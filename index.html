<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LoopTimer GPS Pro</title>
    <style>
        :root {
            --bg-main: #0b0d10;
            --bg-card: #15181f;
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.3);
            --text-main: #ffffff;
            --text-muted: #8b95a5;
            --danger: #ff4d4d;
        }

        body { 
            background: var(--bg-main); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            padding: 0; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .app-header {
            width: 100%;
            background: rgba(21, 24, 31, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            box-sizing: border-box;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-header h1 { font-size: 1.2rem; margin: 0; color: var(--accent); font-weight: 800; }
        
        .container {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            text-align: right;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #0f1115;
            color: white;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border 0.2s;
            margin-bottom: 10px;
            text-align: right;
        }
        input[type="text"]:focus, select:focus { border-color: var(--accent); }

        button.action-btn {
            width: 100%;
            background: linear-gradient(135deg, #00ffcc, #00b386);
            color: #0b0d10;
            font-size: 1.1rem;
            font-weight: 800;
            padding: 16px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 6px 20px var(--accent-glow);
            margin-bottom: 10px;
        }

        button.point-btn {
            width: 100%;
            background: #232833;
            color: var(--accent);
            border: 1px solid rgba(0, 255, 204, 0.2);
            font-size: 0.95rem;
            font-weight: 700;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button.point-btn.set { background: rgba(0, 255, 204, 0.1); border-color: var(--accent); }

        button:active { transform: scale(0.96); }

        #timer { font-size: 3.5rem; font-weight: 900; color: var(--accent); margin: 10px 0 0 0; font-variant-numeric: tabular-nums; line-height: 1; }
        #status { font-size: 0.95rem; color: #ffaa00; font-weight: 500; margin-top: 5px; height: 25px; }
        #infoBox { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

        table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        th, td { padding: 10px 8px; font-size: 0.9rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); text-align: right; }
        th { color: var(--accent); font-weight: 700; }
        td:nth-child(2), th:nth-child(2) { text-align: left; font-variant-numeric: tabular-nums; }
        .label-sm { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; display: block; text-align: right; }
    </style>
</head>
<body>

    <header class="app-header">
        <h1>LoopTimer GPS Pro</h1>
    </header>
    
    <div class="container">
        <div id="timer">00.000</div>
        <div id="status">הגדר נקודות ובחר מצב</div>
        <div id="infoBox">ממתין להפעלת GPS...</div>

        <button class="action-btn" id="startBtn" onclick="toggleSession()" disabled>התחל האזנת GPS</button>

        <div class="card">
            <label class="label-sm">סוג מסלול:</label>
            <select id="modeSelect" onchange="changeMode()">
                <option value="loop">מסלול מעגלי (אותה נקודה לזינוק וסיום)</option>
                <option value="point_to_point">מסלול פתוח (נקודות זינוק וסיום נפרדות)</option>
            </select>

            <div id="pointsContainer" style="margin-top: 10px;">
                <button class="point-btn" id="btnStart" onclick="setPoint('start')">
                    <span>🏁 סמן קו זינוק</span>
                    <span id="txtStart" style="font-size: 0.8rem; color: var(--text-muted);">לא הוגדר</span>
                </button>
                <button class="point-btn" id="btnEnd" onclick="setPoint('end')">
                    <span>🛑 סמן קו סיום</span>
                    <span id="txtEnd" style="font-size: 0.8rem; color: var(--text-muted);">לא הוגדר</span>
                </button>
            </div>
        </div>

        <div class="card">
            <label class="label-sm">שם המסלול / סשן:</label>
            <input type="text" id="trackName" placeholder="למשל: יער / פמפטרק">
            <label class="label-sm">שם הרוכב:</label>
            <input type="text" id="riderName" placeholder="למשל: גל">
        </div>

        <div class="card">
            <div style="font-weight: 700; margin-bottom: 8px; color: var(--accent);">תוצאות מסלול:</div>
            <div id="resultsList" style="font-size: 0.85rem; color: var(--text-muted);">אין עדיין תוצאות.</div>
        </div>
    </div>

    <script>
        let startCoords = null;
        let endCoords = null;
        let isListening = false;
        let isRacing = false;
        let startTime = 0;
        let watchId = null;
        let timerInterval = null;

        const RADIUS_METERS = 5; // רדיוס זיהוי קו (5 מטרים)

        function changeMode() {
            let mode = document.getElementById('modeSelect').value;
            let btnEnd = document.getElementById('btnEnd');
            if (mode === 'loop') {
                btnEnd.style.display = 'none';
                endCoords = startCoords;
            } else {
                btnEnd.style.display = 'flex';
            }
            validateReady();
        }

        function setPoint(type) {
            if (!navigator.geolocation) {
                alert("המכשיר לא תומך ב-GPS!");
                return;
            }

            navigator.geolocation.getCurrentPosition(position => {
                let coords = {
                    lat: position.coords.latitude,
                    lon: position.coords.longitude
                };

                if (type === 'start') {
                    startCoords = coords;
                    document.getElementById('txtStart').innerText = "✓ הוגדר בהצלחה";
                    document.getElementById('btnStart').classList.add('set');
                    let mode = document.getElementById('modeSelect').value;
                    if (mode === 'loop') {
                        endCoords = coords;
                        document.getElementById('txtEnd').innerText = "✓ (זהה לזינוק)";
                    }
                } else {
                    endCoords = coords;
                    document.getElementById('txtEnd').innerText = "✓ הוגדר בהצלחה";
                    document.getElementById('btnEnd').classList.add('set');
                }

                playBeep(600, 0.1);
                validateReady();
            }, err => {
                alert("שגיאה בקליטת GPS. וודא שאישור המיקום פתוח.");
            }, { enableHighAccuracy: true });
        }

        function validateReady() {
            let mode = document.getElementById('modeSelect').value;
            let ready = (mode === 'loop' && startCoords !== null) || (mode === 'point_to_point' && startCoords !== null && endCoords !== null);
            document.getElementById('startBtn').disabled = !ready;
            if (ready) {
                document.getElementById('status').innerText = "הכל מוכן! לחץ להתחלת האזנה";
            }
        }

        function toggleSession() {
            if (!isListening) {
                startListening();
            } else {
                stopListening();
            }
        }

        function startListening() {
            isListening = true;
            isRacing = false;
            document.getElementById('startBtn').innerText = "עצור האזנה";
            document.getElementById('startBtn').style.background = "linear-gradient(135deg, #ff4d4d, #cc0000)";
            document.getElementById('status').innerText = "ממתין שתעבור בקו הזינוק...";

            watchId = navigator.geolocation.watchPosition(checkPosition, err => {}, {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 5000
            });
        }

        function stopListening() {
            isListening = false;
            isRacing = false;
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            if (timerInterval) clearInterval(timerInterval);
            
            document.getElementById('startBtn').innerText = "התחל האזנת GPS";
            document.getElementById('startBtn').style.background = "linear-gradient(135deg, #00ffcc, #00b386)";
            document.getElementById('status').innerText = "האזנה הופסקה.";
            document.getElementById('infoBox').innerText = "";
            document.getElementById('timer').innerText = "00.000";
        }

        function checkPosition(position) {
            if (!isListening) return;

            let current = { lat: position.coords.latitude, lon: position.coords.longitude };
            let mode = document.getElementById('modeSelect').value;

            if (!isRacing) {
                // שלב ממתין לזינוק: בודקים מרחק מקו הזינוק
                let distToStart = getDistance(startCoords.lat, startCoords.lon, current.lat, current.lon);
                document.getElementById('infoBox').innerText = `מרחק מקו הזינוק: ${distToStart.toFixed(1)} מ'`;

                // אם הרוכב חצה את קו הזינוק (נכנס לרדיוס)
                if (distToStart <= RADIUS_METERS) {
                    isRacing = true;
                    startTime = performance.now();
                    document.getElementById('status').innerText = "⚡ זינוק! הטיימר פועל...";
                    playBeep(1000, 0.2);

                    timerInterval = setInterval(() => {
                        let elapsed = (performance.now() - startTime) / 1000;
                        document.getElementById('timer').innerText = elapsed.toFixed(3);
                    }, 50);
                }
            } else {
                // שלב במירוץ: מחכים לקו סיום
                let targetCoords = (mode === 'loop') ? startCoords : endCoords;
                let distToEnd = getDistance(targetCoords.lat, targetCoords.lon, current.lat, current.lon);
                let elapsedTotal = (performance.now() - startTime) / 1000;

                document.getElementById('infoBox').innerText = `מרחק מקו סיום: ${distToEnd.toFixed(1)} מ' (זמן: ${elapsedTotal.toFixed(1)}ש)`;

                // הגנה למסלולים קטנים: חובה שיעברו לפחות 3 שניות לפני שאפשר לעצור
                if (distToEnd <= RADIUS_METERS && elapsedTotal >= 3.0) {
                    // הגעה לקו סיום!
                    isRacing = false;
                    clearInterval(timerInterval);
                    playBeep(1500, 0.5);

                    let finalTime = elapsedTotal;
                    document.getElementById('timer').innerText = finalTime.toFixed(3);
                    document.getElementById('status').innerText = "🏆 סיום ראן! נשמר בהצלחה.";

                    saveResult(finalTime);

                    // במצב מעגלי, ברגע שנעצרנו על נקודת הסיום שהיא גם זינוק, נשארים במצב מוכן לסיבוב הבא
                    if (mode === 'loop') {
                        setTimeout(() => {
                            if (isListening) {
                                document.getElementById('status').innerText = "מוכן לסיבוב הבא - עבור בקו!";
                            }
                        }, 2000);
                    } else {
                        // במסלול פתוח נעצור את ההאזנה או נחזיר להמתנה לזינוק חדש
                        stopListening();
                    }
                }
            }
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            let R = 6371000;
            let dLat = (lat2 - lat1) * Math.PI / 180;
            let dLon = (lon2 - lon1) * Math.PI / 180;
            let a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function playBeep(freq, duration) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function saveResult(time) {
            let track = document.getElementById('trackName').value || "מסלול GPS";
            let rider = document.getElementById('riderName').value || "רוכב";
            
            let history = JSON.parse(localStorage.getItem('loopTimerHistory') || '[]');
            history.push({ track: track, rider: rider, time: time, date: Date.now() });
            localStorage.setItem('loopTimerHistory', JSON.stringify(history));
            loadResults();
        }

        function loadResults() {
            let history = JSON.parse(localStorage.getItem('loopTimerHistory') || '[]');
            let container = document.getElementById('resultsList');
            if (history.length === 0) {
                container.innerHTML = "אין עדיין תוצאות שמורות.";
                return;
            }
            history.sort((a, b) => a.time - b.time);
            let html = "<table><tr><th>רוכב</th><th>זמן</th></tr>";
            history.forEach(item => {
                html += `<tr><td><b>${item.rider}</b><br><span style="font-size:0.75rem; color:var(--text-muted);">${item.track}</span></td><td style="color:var(--accent); font-weight:bold;">${item.time.toFixed(3)}</td></tr>`;
            });
            html += "</table>";
            container.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', loadResults);
    </script>
</body>
</html>
